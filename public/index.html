<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Real-time Chat</title>
    <style>
        #chat-window { height: 300px; border: 1px solid #ccc; overflow-y: scroll; padding: 10px; margin-bottom: 10px; }
        .read-status { font-size: 0.8em; color: blue; margin-left: 5px; }
        #typing-indicator { font-style: italic; color: gray; height: 20px; }
    </style>
</head>
<body>
    <h2>JS Chat App</h2>
    <input type="text" id="username" placeholder="Your Name">
    <input type="text" id="roomInput" placeholder="Room Name">
    <button onclick="joinRoom()">Join Room</button>
	
    <h3 id="current-room-display">You haven't joined a room yet.</h3>
    <div id="chat-window"></div>
    <div id="typing-indicator"></div>

    <input type="text" id="messageInput" placeholder="Type a message..." onkeypress="handleTyping()">
    <button onclick="sendMessage()">Send</button>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentRoom = "";
        let timeout;
		
        function joinRoom() {
            const roomInput = document.getElementById('roomInput');
            currentRoom = roomInput.value;

            if (currentRoom !== "") {
                // Send join room request to the server
                socket.emit('join_room', currentRoom);

                // Update the current room display heading
                document.getElementById('current-room-display').innerText = "Current Room: " + currentRoom;
				
                // Optional: Clear the input field
                roomInput.value = "";
				
                console.log("Successfully joined room: " + currentRoom);
            } else {
                alert("Please enter a room name!");
            }
        }

        // Send Message
        function sendMessage() {
            const message = document.getElementById('messageInput').value;
            const sender = document.getElementById('username').value;
            const msgId = 'msg_' + Date.now();

            const data = { room: currentRoom, message, sender, msgId };
            socket.emit('send_message', data);
            document.getElementById('messageInput').value = "";
        }

        // Receive Message
        socket.on('receive_message', (data) => {
            const chatWindow = document.getElementById('chat-window');
            const msgDiv = document.createElement('div');
            msgDiv.id = data.msgId;
            msgDiv.innerHTML = `<b>${data.sender}:</b> ${data.message} <span class="read-status" id="status_${data.msgId}"></span>`;
            chatWindow.appendChild(msgDiv);

            // If the message is from someone else, send a "read" acknowledgement back
            if(data.sender !== document.getElementById('username').value) {
                socket.emit('message_read', { room: currentRoom, msgId: data.msgId });
            }
        });

        // Typing Indicator Logic
        function handleTyping() {
            socket.emit('typing', { room: currentRoom, user: document.getElementById('username').value, isTyping: true });
			
            clearTimeout(timeout);
            timeout = setTimeout(() => {
                socket.emit('typing', { room: currentRoom, user: document.getElementById('username').value, isTyping: false });
            }, 2000);
        }

        socket.on('display_typing', (data) => {
            const indicator = document.getElementById('typing-indicator');
            indicator.innerText = data.isTyping ? `${data.user} is typing...` : "";
        });

        // Update Read Status
        socket.on('update_read_status', (data) => {
            const statusSpan = document.getElementById(`status_${data.msgId}`);
            if (statusSpan) statusSpan.innerText = "✓ Seen";
        });
    </script>
</body>
</html>
